name: Html Validator

on:
  pull_request:
    branches:
      - develop

jobs:
  htmlValidation:
    runs-on: ubuntu-latest
    name: Html Validation
    steps:
      - uses: actions/checkout@v4
      - name: HTML5Validator
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: /